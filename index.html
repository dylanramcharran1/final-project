<!DOCTYPE html>
<html>
<head>
    <title>Judge Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; }
        .login-box { width: 300px; margin: 100px auto; background: #fff; padding: 20px; border-radius: 8px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 8px; margin: 8px 0; }
        button { width: 100%; padding: 10px; background: #333; color: #fff; border: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Judge Login</h2>
        <form action="rubric.php" method="post">
            <input type="text" name="username" placeholder="Judge Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
